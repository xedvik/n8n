<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="wizard-token" content="">
    <meta name="color-scheme" content="light">
    <title>CRM Automation Kit — настройка</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">CK</div>
          <div>
            <p class="eyebrow">CRM Automation Kit</p>
            <h1>Настройка клиента</h1>
          </div>
        </div>
        <div class="top-status" id="top-status" aria-live="polite"></div>
      </header>

      <div class="progress-wrap" aria-label="Общий прогресс настройки">
        <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
        <span class="progress-label" id="progress-label">Шаг 1</span>
      </div>

      <div class="layout">
        <aside class="sidebar">
          <nav aria-label="Этапы настройки">
            <ol class="stepper" id="stepper"></ol>
          </nav>
          <div class="sidebar-note">
            <strong>Локально и безопасно</strong>
            <p>Мастер работает только на этом компьютере. API-ключ n8n не передаётся в браузер.</p>
          </div>
        </aside>

        <main class="content">
          <div id="boot-error" class="notice notice-error hidden" role="alert"></div>
          <section id="step-content" aria-live="polite"></section>
          <div class="actions" id="actions"></div>
        </main>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <dialog id="confirm-dialog" class="dialog">
      <form method="dialog">
        <h2 id="confirm-title">Подтвердите действие</h2>
        <p id="confirm-text"></p>
        <div class="dialog-actions">
          <button class="btn btn-ghost" value="cancel">Отмена</button>
          <button class="btn btn-danger" value="confirm">Подтвердить</button>
        </div>
      </form>
    </dialog>

    <script src="/app.js" defer></script>
  </body>
</html>
